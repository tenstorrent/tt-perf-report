name: Verify Data Output

on: push

jobs:
  build:
    name: Validate CSV Output (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 gets a lower Pillow floor than 3.11+; see pyproject.toml.
        python-version: ["3.10", "3.11", "3.x"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: >-
        python3 -m
        pip install ".[test]"

    - name: Check Pillow security floor
      run: >-
        python -c "import sys, PIL;
        version = tuple(int(part) for part in PIL.__version__.split('.')[:2]);
        floor = (13, 0) if sys.version_info >= (3, 11) else (12, 3);
        print('Pillow', PIL.__version__, 'floor', floor);
        assert version >= floor, 'Pillow below the security floor in pyproject.toml'"

    - name: Run tests
      run: python -m pytest -v
    