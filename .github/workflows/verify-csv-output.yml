name: Verify Data Output

on: push

jobs:
  build:
    name: Validate CSV Output (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 gets a lower Pillow floor than 3.11+; see pyproject.toml.
        python-version: ["3.10", "3.11", "3.x"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: python -m pip install ".[test]"

    - name: Show Pillow version
      run: python -c "import PIL; print('Pillow', PIL.__version__)"

    - name: Run tests
      run: python -m pytest -v
